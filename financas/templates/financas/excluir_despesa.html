{% extends 'base.html' %}

{% block title %}Excluir Despesa{% endblock %}

{% block conteudo %}
    <h1>Excluir Despesa</h1>

    <p>Tem certeza que deseja excluir essa despesa?</p>
    <p>{{ despesa.data }} - {{ despesa.descricao }} - R$ {{ despesa.valor }} ({{ despesa.tipo }})</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Sim, excluir</button>
    </form>

    <p><a href="{% url 'lista_despesas' %}">Cancelar</a></p>
{% endblock %}
