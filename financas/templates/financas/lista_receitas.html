<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minhas Receitas</title>
</head>
<body>
    <h1>Minhas Receitas</h1>

    <p><a href="{% url 'criar_receita' %}">+ Nova Receita</a></p>

    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Sair</button>
    </form>

    <ul>
        {% for receita in receitas %}
            <li>{{ receita.data }} - {{ receita.descricao }} - R$ {{ receita.valor }} ({{ receita.tipo }})
                <a href="{% url 'editar_receita' receita.id %}">Editar</a>
            </li>
        {% empty %}
            <li>Nenhuma receita cadastrada ainda.</li>
        {% endfor %}
    </ul>
</body>
</html>
