<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Despesas</title>
</head>
<body>
    <h1>Minhas Despesas</h1>

    <ul>
        {% for despesa in despesas %}
            <li>{{ despesa.data }} - {{ despesa.descricao }} - R$ {{ despesa.valor }} - ({{ despesa.tipo }})</li>
        {% empty %}
            <li>Nenhuma despesa cadastrada ainda.</li>
        {% endfor %}    
    </ul>
</body>
</html>
